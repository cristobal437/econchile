[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "econchile"
version = "0.2.0"
description = "Python library to retrieve Chilean macroeconomic data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Cristóbal Almendra"}
]
keywords = ["chile", "economics", "macro", "banco-central", "bde"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["requests>=2.31"]

[project.urls]
Homepage = "https://github.com/cristobal437/econchile"
Repository = "https://github.com/cristobal437/econchile"

[project.optional-dependencies]
test = ["pytest>=7.0"]
examples = ["matplotlib>=3.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["econchile*"]
exclude = ["econchile.study*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
